[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caddev"
version = "0.1.0"
description = "Development server for build123d projects integrated with FreeCAD"
requires-python = ">=3.11"

dependencies = [
    "build123d",
    "watchfiles",
]

[project.scripts]
caddev = "caddev.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caddev"]

[tool.hatch.build.targets.wheel.force-include]
"src/caddev/fontconfig/fonts.conf" = "caddev/fontconfig/fonts.conf"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
